name: Build Medito APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get

    - name: Generate Code (Pigeon & Build Runner)
      run: |
        flutter pub run pigeon --input pigeon_conf.dart --package_name=meditofoundation.medito
        dart run build_runner build --delete-conflicting-outputs

    - name: Setup Mock Build Configuration & Keystore
      run: |
        # Satisfy Gradle's keystore requirements
        cp android/keystore.properties.example android/keystore.properties || touch android/keystore.properties

        # Create a comprehensive google-services.json covering both base and dev package names
        mkdir -p android/app
        cat << 'EOF' > android/app/google-services.json
        {
          "project_info": {
            "project_number": "123456789",
            "project_id": "medito-mock",
            "storage_bucket": "medito-mock.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abcdef123456",
                "android_client_info": {
                  "package_name": "meditofoundation.medito"
                }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyMockKeyForBuildingTheApp12345" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            },
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abcdef654321",
                "android_client_info": {
                  "package_name": "meditofoundation.medito.dev"
                }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyMockKeyForBuildingTheApp12345" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            },
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abcdef789012",
                "android_client_info": {
                  "package_name": "com.yourcompany.yourapp.dev"
                }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyMockKeyForBuildingTheApp12345" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Build Android APK (Mock Flavor/Debug)
      run: flutter build apk --flavor dev --dart-define=MOCK_MODE=true --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: medito-mock-debug-apk
        path: build/app/outputs/flutter-apk/app-dev-debug.apk
